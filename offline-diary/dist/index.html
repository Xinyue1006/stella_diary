<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244c3b">
  <meta name="application-name" content="小猪向阳日记">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="向阳日记">
  <meta name="description" content="六只小猪陪你记录日常。离线写日记，联网后在电脑和 iPhone 之间私人同步。">
  <title>小猪向阳日记</title>
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./offline.js" defer></script>
  <script src="./app.js" type="module"></script>
</head>
<body>
  <aside id="rail">
    <div id="brand"><img class="app-icon" src="./assets/apple-touch-icon.png" width="46" height="46" alt=""><strong class="brand-name">小猪向阳日记</strong><button id="install-guide" type="button" hidden>添加到主屏幕</button></div>
    <nav id="tabbar" aria-label="日记导航">
      <button id="phone-back" type="button" data-action="back" hidden><svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>返回</span></button>
      <button id="phone-save" type="submit" class="button primary" hidden></button>
      <button type="button" data-tab="today" aria-current="page"><svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>今天</span></button>
      <button type="button" data-tab="review"><svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M7.5 2.5v5m9-5v5M3.5 10.5h17m-13 4h3m2.5 0h3"/></svg><span>回看</span></button>
      <button type="button" data-tab="countdowns"><svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.7 6.1.9-4.4 4.4 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.4 6.1-.9Z"/></svg><span>期待</span></button>
      <button type="button" data-tab="settings"><svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 21v-2.1a7.5 7.5 0 0 1 15 0V21"/></svg><span>我的</span></button>
    </nav>
    <div id="offline-status" role="status">正在准备离线使用…</div>
  </aside>
  <div id="content">
    <header id="page-header" hidden></header>
    <main id="app" tabindex="-1"><p>正在打开你的小日记…</p></main>
    <noscript>请在 Safari 中开启 JavaScript 以使用日记。</noscript>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="install-sheet" aria-labelledby="install-title">
    <h2 id="install-title">把小猪放到主屏幕</h2>
    <ol><li>在 Safari 打开这本日记，点「分享」。</li><li>选「添加到主屏幕」。如果看到「作为网页 App 打开」，将它打开，再点「添加」。</li><li>保持联网，从新图标打开一次。等到「离线已就绪」后，以后就可以断网写了。</li></ol>
    <form method="dialog"><button class="button primary" autofocus>知道了</button></form>
  </dialog>
</body>
</html>
